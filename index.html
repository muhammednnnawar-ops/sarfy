/* ==========================================================================
   SARFY - World-Class Next-Gen Personal Finance UI/UX Design System
   مستوحى من أرقى تطبيقات التقنية المالية العالمية (Apple Wallet, Revolut, Linear)
   ========================================================================== */

@charset "UTF-8";

/* استيراد الخطوط الحديثة النقية */
@import url('https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700;800&family=Cairo:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');

:root {
  /* الخطوط */
  --font-display: 'Cairo', 'Readex Pro', -apple-system, sans-serif;
  --font-sans: 'Readex Pro', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-numeric: 'Plus Jakarta Sans', 'JetBrains Mono', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  /* راديوس الزوايا */
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-pill: 9999px;

  /* =======================================================================
     الوضع المظلم السيبراني الفاخر (Cyber Obsidian Dark - Default)
     ======================================================================= */
  --bg-deep: #05070D;
  --bg-canvas: #090D18;
  --bg-card: rgba(15, 23, 42, 0.75);
  --bg-card-hover: rgba(23, 34, 60, 0.85);
  --bg-card-solid: #0F172A;
  --bg-input: rgba(15, 23, 42, 0.9);
  --bg-elevated: #162035;

  /* ألوان النصوص */
  --text-primary: #F8FAFC;
  --text-secondary: #94A3B8;
  --text-muted: #64748B;
  --text-disabled: #475569;

  /* الألوان الوظيفية المالية فائقة النقاء */
  --emerald: #10B981;
  --emerald-light: rgba(16, 185, 129, 0.12);
  --emerald-border: rgba(16, 185, 129, 0.3);
  --emerald-glow: 0 0 24px rgba(16, 185, 129, 0.3);

  --coral: #F43F5E;
  --coral-light: rgba(244, 63, 94, 0.12);
  --coral-border: rgba(244, 63, 94, 0.3);
  --coral-glow: 0 0 24px rgba(244, 63, 94, 0.3);

  --amber: #F59E0B;
  --amber-light: rgba(245, 158, 11, 0.12);
  --amber-border: rgba(245, 158, 11, 0.3);
  --amber-glow: 0 0 24px rgba(245, 158, 11, 0.3);

  --indigo: #6366F1;
  --indigo-light: rgba(99, 102, 241, 0.12);
  --indigo-border: rgba(99, 102, 241, 0.3);
  --indigo-glow: 0 0 24px rgba(99, 102, 241, 0.3);

  --cyan: #06B6D4;
  --cyan-light: rgba(6, 182, 212, 0.12);

  /* الحدود والظلال والـ Glassmorphism */
  --border-subtle: rgba(255, 255, 255, 0.07);
  --border-focus: rgba(16, 185, 129, 0.6);
  --border-glass: rgba(255, 255, 255, 0.12);

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 10px 30px -5px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  --shadow-lg: 0 20px 45px -10px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  --shadow-card: 0 8px 24px -4px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);

  --backdrop-blur: blur(20px);
  --orb-emerald: rgba(16, 185, 129, 0.2);
  --orb-indigo: rgba(99, 102, 241, 0.16);
}

/* =======================================================================
   الوضع الفاتح الراقي المطور (Swiss / Apple / Stripe Luxury Light Mode)
   ألوان ناصعة، تباين عالي ومريح للعين، وظلال زجاجية نقية
   ======================================================================= */
[data-theme="light"] {
  --bg-deep: #F8FAFC;
  --bg-canvas: #FFFFFF;
  --bg-card: #FFFFFF;
  --bg-card-hover: #F8FAFC;
  --bg-card-solid: #FFFFFF;
  --bg-input: #FFFFFF;
  --bg-elevated: #F1F5F9;

  --text-primary: #0F172A;
  --text-secondary: #334155;
  --text-muted: #64748B;
  --text-disabled: #94A3B8;

  --emerald: #059669;
  --emerald-light: rgba(5, 150, 105, 0.08);
  --emerald-border: rgba(5, 150, 105, 0.22);
  --emerald-glow: 0 0 16px rgba(5, 150, 105, 0.15);

  --coral: #DC2626;
  --coral-light: rgba(220, 38, 38, 0.08);
  --coral-border: rgba(220, 38, 38, 0.22);
  --coral-glow: 0 0 16px rgba(220, 38, 38, 0.15);

  --amber: #D97706;
  --amber-light: rgba(217, 119, 6, 0.08);
  --amber-border: rgba(217, 119, 6, 0.22);
  --amber-glow: 0 0 16px rgba(217, 119, 6, 0.15);

  --indigo: #4F46E5;
  --indigo-light: rgba(79, 70, 229, 0.08);
  --indigo-border: rgba(79, 70, 229, 0.22);
  --indigo-glow: 0 0 16px rgba(79, 70, 229, 0.15);

  --cyan: #0284C7;
  --cyan-light: rgba(2, 132, 199, 0.08);
  --cyan-border: rgba(2, 132, 199, 0.22);

  --border-subtle: #E2E8F0;
  --border-focus: rgba(5, 150, 105, 0.5);
  --border-glass: #CBD5E1;

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
  --shadow-card: 0 1px 3px 0 rgba(15, 23, 42, 0.05), 0 1px 2px -1px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 4px 8px -1px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 12px 24px -4px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.03);

  --orb-emerald: rgba(16, 185, 129, 0.05);
  --orb-indigo: rgba(99, 102, 241, 0.04);
}

/* =======================================================================
   إعادة الضبط الأساسي وقواعد الطباعة العربية
   ======================================================================= */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  background-color: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font-sans);
  direction: rtl;
  text-align: right;
  line-height: 1.6;
  font-size: 14px;
  overflow-x: hidden;
  width: 100%;
  min-height: 100vh;
  letter-spacing: normal !important; /* هام جداً: الحفاظ على اتصال الحروف العربية */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color 0.3s ease, color 0.3s ease;
}

/* هالات الضوء المحيطية الفاخرة بالخلفية Ambient Orbs */
body::before {
  content: '';
  position: fixed;
  top: -15%;
  right: -10%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, var(--orb-emerald) 0%, transparent 70%);
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  bottom: -15%;
  left: -10%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, var(--orb-indigo) 0%, transparent 70%);
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
}

/* تنسيق الأرقام والمبالغ المالية (Monospace & Tabular) */
.money-number, .tabular-num {
  font-family: var(--font-numeric);
  font-variant-numeric: tabular-nums;
  direction: ltr;
  display: inline-block;
  font-weight: 700;
}

/* =======================================================================
   الهيكل العام للتطبيق والـ Layout
   ======================================================================= */
.app-container {
  display: flex;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

/* الشريط الجانبي للشاشات الكبيرة (Desktop Sidebar) */
.desktop-sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--bg-card);
  backdrop-filter: var(--backdrop-blur);
  border-left: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  bottom: 0;
  right: 0;
  z-index: 50;
  padding: 12px 10px 10px;
  box-shadow: -4px 0 30px rgba(0, 0, 0, 0.2);
  overflow: hidden;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 4px 8px;
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: 6px;
}

.brand-logo {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--emerald) 0%, #059669 100%);
  color: #FFFFFF;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 900;
  box-shadow: var(--emerald-glow);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}

.brand-logo::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, transparent 100%);
  pointer-events: none;
}

.brand-logo.small {
  width: 28px;
  height: 28px;
  font-size: 16px;
  border-radius: 6px;
}

.brand-info {
  display: flex;
  flex-direction: column;
}

.brand-name {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 800;
  color: var(--text-primary);
  line-height: 1.1;
}

.brand-sub {
  font-size: 9.5px;
  color: var(--text-muted);
  font-weight: 500;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 0;
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-left: 0;
  scrollbar-width: none !important; /* إخفاء شريط التمرير تماماً في Firefox */
  -ms-overflow-style: none !important; /* إخفاء شريط التمرير في IE و Edge */
}

/* إخفاء شريط التمرير تماماً في WebKit (Chrome, Safari, Edge, Opera) */
.sidebar-nav::-webkit-scrollbar,
.desktop-sidebar::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 11px;
  border-radius: 7px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  text-align: right;
  width: 100%;
  transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.nav-link:hover {
  background-color: var(--bg-card-hover);
  color: var(--text-primary);
  border-color: var(--border-subtle);
  transform: translateX(-2px);
}

.nav-link.active {
  background: linear-gradient(90deg, var(--emerald-light) 0%, rgba(16, 185, 129, 0.02) 100%);
  color: var(--emerald);
  border: 1px solid var(--emerald-border);
  font-weight: 700;
  box-shadow: inset 3px 0 0 var(--emerald);
}

.nav-link.active .svg-icon {
  stroke: var(--emerald);
}

.nav-label {
  flex: 1;
}

.nav-badge-alert {
  background: linear-gradient(135deg, var(--coral) 0%, #E11D48 100%);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 1px 6px;
  border-radius: var(--radius-pill);
  box-shadow: var(--coral-glow);
}

.sidebar-footer {
  padding-top: 8px;
  margin-top: auto;
  border-top: 1px solid var(--border-subtle);
}

.theme-toggle-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-elevated);
  color: var(--text-primary);
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 600;
  transition: all 0.2s ease;
}

.theme-toggle-btn:hover {
  border-color: var(--border-glass);
  box-shadow: var(--shadow-sm);
}

.lock-quick-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--coral-border);
  background-color: var(--coral-light);
  color: var(--coral);
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 700;
  transition: all 0.2s ease;
}

.lock-quick-btn:hover {
  box-shadow: var(--coral-glow);
}

/* =======================================================================
   منطقة المحتوى الرئيسية
   ======================================================================= */
.main-wrapper {
  flex: 1;
  margin-right: 260px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  width: calc(100% - 260px);
}

.page-content {
  flex: 1;
  padding: 22px 20px 90px;
  max-width: 1560px;
  margin: 0 auto;
  width: 100%;
}

/* شريط الموبايل العلوي المطور */
.mobile-header {
  display: none;
  height: 60px;
  background: var(--bg-card);
  backdrop-filter: var(--backdrop-blur);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0 16px;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 40;
}

.hamburger-btn {
  background: none;
  border: none;
  color: var(--text-primary);
  cursor: pointer;
  padding: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-xs);
}

.header-quick-add-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--emerald) 0%, #059669 100%);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--emerald-glow);
}

/* =======================================================================
   البطاقة الرئيسية الرائدة (Apple Wallet / Revolut Style VIP Hero)
   ======================================================================= */
.total-money-card {
  background: linear-gradient(135deg, var(--bg-card-solid) 0%, rgba(20, 32, 58, 0.8) 100%);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-xl);
  padding: 32px 36px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  position: relative;
  overflow: hidden;
  backdrop-filter: var(--backdrop-blur);
}

.total-money-card::before {
  content: '';
  position: absolute;
  top: -50px;
  right: -50px;
  width: 320px;
  height: 320px;
  background: radial-gradient(circle, rgba(16, 185, 129, 0.22) 0%, transparent 65%);
  filter: blur(40px);
  pointer-events: none;
}

.total-money-card::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
}

.total-money-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  background: var(--emerald-light);
  border: 1px solid var(--emerald-border);
  border-radius: var(--radius-pill);
  font-size: 11px;
  color: var(--emerald);
  font-weight: 700;
}

.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: var(--emerald);
  box-shadow: var(--emerald-glow);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { transform: scale(0.95); opacity: 0.8; }
  50% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(0.95); opacity: 0.8; }
}

.total-money-amount {
  font-family: var(--font-numeric);
  font-size: 46px;
  font-weight: 800;
  color: var(--text-primary);
  line-height: 1.1;
  display: flex;
  align-items: baseline;
  gap: 12px;
  text-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
}

.total-money-amount .currency-symbol {
  font-family: var(--font-display);
  font-size: 24px;
  color: var(--emerald);
  font-weight: 700;
}

.total-money-underline {
  width: 72px;
  height: 4px;
  background: linear-gradient(90deg, var(--emerald) 0%, rgba(16, 185, 129, 0.2) 100%);
  border-radius: var(--radius-pill);
  margin: 14px 0 12px;
  box-shadow: var(--emerald-glow);
}

.total-money-sub {
  font-size: 13px;
  color: var(--text-secondary);
}

/* المنحنى البياني النيون المدمج داخل بطاقة الهيرو (Lumin Reference Style) */
.hero-sparkline-wrap {
  width: 100%;
  position: relative;
  overflow: visible;
}

/* =======================================================================
   شبكة البنتو المتقدمة (Moneed & Fingoals Bento Hero Grid)
   ======================================================================= */
.bento-hero-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr;
  gap: 18px;
  margin-bottom: 24px;
}

@media (max-width: 1080px) {
  .bento-hero-grid {
    grid-template-columns: 1fr;
  }
}

.companion-bento-card {
  background: var(--bg-card);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-xl);
  padding: 24px 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  backdrop-filter: var(--backdrop-blur);
  box-shadow: var(--shadow-card);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  position: relative;
  overflow: hidden;
}

.companion-bento-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--border-subtle);
}

.bento-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.bento-card-badge {
  display: flex;
  align-items: center;
  gap: 8px;
}

.bento-icon-circle {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.bento-icon-emerald {
  background: var(--emerald-light);
  color: var(--emerald);
  box-shadow: 0 2px 10px rgba(16, 185, 129, 0.2);
}

.bento-icon-coral {
  background: var(--coral-light);
  color: var(--coral);
  box-shadow: 0 2px 10px rgba(244, 63, 94, 0.2);
}

.bento-growth-tag {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: var(--radius-pill);
}

.growth-positive {
  background: var(--emerald-light);
  color: var(--emerald);
  border: 1px solid var(--emerald-border);
}

.growth-negative {
  background: var(--coral-light);
  color: var(--coral);
  border: 1px solid var(--coral-border);
}

.bento-amount-val {
  font-family: var(--font-numeric);
  font-size: 28px;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

.bento-sub-tags {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 11.5px;
  color: var(--text-muted);
}

.bento-sub-tag-item {
  background: var(--bg-input);
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  font-weight: 600;
}

/* شريط تصنيفات المصروفات المقسم متعدد الألوان Segmented Category Bar */
.segmented-category-bar {
  display: flex;
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  gap: 2px;
  margin: 10px 0 6px;
  background: var(--bg-input);
}

.category-bar-segment {
  height: 100%;
  transition: width 0.4s ease;
}

/* زر إخفاء/إظهار الرصيد للخصوصية */
.privacy-toggle-btn {
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 4px 8px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.2s ease;
}

.privacy-toggle-btn:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
  border-color: var(--border-glass);
}

/* شريط الالتزامات القادمة السريعة (Pay Reference Style Upcoming Strip) */
.upcoming-strip-container {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 8px 4px 12px;
  margin: -6px -4px -6px;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
}

.upcoming-strip-container::-webkit-scrollbar {
  height: 4px;
}

.upcoming-strip-container::-webkit-scrollbar-thumb {
  background: var(--border-subtle);
  border-radius: 4px;
}

.upcoming-payment-chip {
  flex: 0 0 auto;
  min-width: 175px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  scroll-snap-align: start;
}

.upcoming-payment-chip:hover {
  border-color: var(--amber);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(245, 158, 11, 0.15);
}

.chip-icon-box {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* =======================================================================
   شريط الحسابات المصرفية السريع (Lumin Quick Accounts Strip)
   ======================================================================= */
.quick-accounts-strip-card {
  background: var(--bg-card);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  backdrop-filter: var(--backdrop-blur);
  box-shadow: var(--shadow-card);
  overflow: visible;
}

.quick-strip-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.quick-accounts-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  overflow-y: visible;
  padding: 8px 6px 12px;
  margin: -6px -6px -6px;
  -webkit-overflow-scrolling: touch;
}

.quick-accounts-scroll::-webkit-scrollbar {
  height: 4px;
}

.quick-accounts-scroll::-webkit-scrollbar-thumb {
  background: var(--border-subtle);
  border-radius: 4px;
}

.quick-acc-chip {
  flex: 0 0 auto;
  min-width: 195px;
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
  will-change: transform;
  position: relative;
}

.quick-acc-chip:hover {
  transform: translateY(-2px);
  border-color: var(--cyan);
  background: var(--bg-card-hover);
  box-shadow: 0 8px 24px rgba(6, 182, 212, 0.25);
  z-index: 2;
}

.quick-acc-avatar {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.avatar-bank {
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid rgba(16, 185, 129, 0.3);
}

.avatar-wallet {
  background: rgba(244, 63, 94, 0.15);
  border: 1px solid rgba(244, 63, 94, 0.3);
}

.avatar-cash {
  background: rgba(245, 158, 11, 0.15);
  border: 1px solid rgba(245, 158, 11, 0.3);
}

.avatar-add {
  background: rgba(6, 182, 212, 0.15);
  color: var(--cyan);
  font-size: 22px;
  font-weight: 700;
  border: 1px dashed var(--cyan);
}

.quick-acc-details {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.quick-acc-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
}

.quick-acc-bal {
  font-family: var(--font-numeric);
  font-size: 12.5px;
  font-weight: 800;
  color: var(--emerald);
  direction: ltr;
  text-align: right;
}

.quick-acc-action {
  color: var(--text-muted);
  transition: color 0.2s ease, transform 0.2s ease;
}

.quick-acc-chip:hover .quick-acc-action {
  color: var(--cyan);
  transform: scale(1.15);
}

/* =======================================================================
   مساعد صرفي المالي الذكي (AI Financial Copilot - Dropify Reference Style)
   ======================================================================= */
.ai-copilot-banner {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, rgba(99, 102, 241, 0.08) 50%, rgba(6, 182, 212, 0.08) 100%);
  border: 1px solid rgba(16, 185, 129, 0.25);
  border-radius: var(--radius-xl);
  padding: 22px 24px;
  backdrop-filter: var(--backdrop-blur);
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 30px -8px rgba(16, 185, 129, 0.15);
  transition: all 0.3s ease;
}

.ai-copilot-banner:hover {
  border-color: rgba(16, 185, 129, 0.4);
  box-shadow: 0 14px 40px -6px rgba(16, 185, 129, 0.25);
}

.ai-copilot-banner::before {
  content: '';
  position: absolute;
  top: -50px;
  left: 20%;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
  filter: blur(50px);
  pointer-events: none;
}

.ai-banner-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 10px;
}

.ai-sparkle-icon {
  font-size: 18px;
  animation: pulse 2s infinite;
}

.ai-banner-title {
  font-weight: 800;
  font-size: 14.5px;
  color: var(--text-primary);
  letter-spacing: -0.2px;
}

.ai-pill-live {
  background: rgba(16, 185, 129, 0.15);
  color: var(--emerald);
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  border: 1px solid rgba(16, 185, 129, 0.3);
}

.ai-banner-content {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.ai-banner-text {
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--text-secondary);
  margin: 0;
}

.ai-banner-text strong {
  color: var(--text-primary);
  font-weight: 700;
}

.ai-banner-btns {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.ai-btn-action {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 8px 16px;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  color: var(--text-primary);
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.ai-btn-action:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-glass);
  transform: translateY(-1px);
}

.ai-btn-action.primary {
  background: linear-gradient(135deg, var(--emerald) 0%, #059669 100%);
  color: #FFFFFF;
  border-color: transparent;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
}

.ai-btn-action.primary:hover {
  box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45);
}

/* أزرار التبديل السريع بين الأهداف المالية (Fingoals Reference Style) */
.goal-switcher-pills {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.goal-pill {
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-pill);
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.goal-pill:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
}

.goal-pill.active {
  background: rgba(16, 185, 129, 0.15);
  color: var(--emerald);
  border-color: var(--emerald-border);
  box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
}

.goal-pill-pct {
  font-family: var(--font-numeric);
  font-size: 10px;
  font-weight: 800;

}

.cards-carousel-box {

  flex-direction: column;
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
}

  .cards-and-goals-grid {
    grid-template-columns: minmax(0, 1fr);

  border-radius: var(--radius-lg);

.alerts-header {

}

.alerts-list {

  font-size: 13px;

.alert-item.alert-red {

  color: var(--coral);

}

.alert-item.alert-yellow {
  background: linear-gradient(90deg, var(--amber-light) 0%, rgba(245, 158, 11, 0.03) 100%);
  color: var(--amber);
  border-right-color: var(--amber);
}

/* =======================================================================
   شبكة البطاقات الذكية (Bento Grid Metrics)
   ======================================================================= */
.metric-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}

.metric-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: var(--backdrop-blur);
  overflow: hidden;
}

.metric-card::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 3px;
  background: transparent;
  transition: background 0.25s ease;
}

.metric-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
  border-color: var(--border-glass);
}

.metric-card.card-emerald::before { background: linear-gradient(90deg, var(--emerald) 0%, transparent 100%); }
.metric-card.card-rust::before { background: linear-gradient(90deg, var(--coral) 0%, transparent 100%); }
.metric-card.card-ochre::before { background: linear-gradient(90deg, var(--amber) 0%, transparent 100%); }
.metric-card.card-navy::before { background: linear-gradient(90deg, var(--indigo) 0%, transparent 100%); }

.metric-card-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.metric-pill {
  font-size: 10.5px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: var(--radius-pill);
  font-family: var(--font-sans);
}

.pill-emerald {
  background: var(--emerald-light);
  color: var(--emerald);
  border: 1px solid var(--emerald-border);
}

.pill-coral {
  background: var(--coral-light);
  color: var(--coral);
  border: 1px solid var(--coral-border);
}

.pill-amber {
  background: var(--amber-light);
  color: var(--amber);
  border: 1px solid var(--amber-border);
}

.pill-cyan {
  background: var(--cyan-light);
  color: var(--cyan);
  border: 1px solid rgba(6, 182, 212, 0.3);
}

.metric-icon-wrap {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}

.card-emerald .metric-icon-wrap { background: var(--emerald-light); color: var(--emerald); }
.card-rust .metric-icon-wrap { background: var(--coral-light); color: var(--coral); }
.card-ochre .metric-icon-wrap { background: var(--amber-light); color: var(--amber); }
.card-navy .metric-icon-wrap { background: var(--indigo-light); color: var(--indigo); }

.metric-label {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 500;
}

.metric-value {

}

  font-size: 11.5px;
  color: var(--text-muted);
  line-height: 1.4;
}
