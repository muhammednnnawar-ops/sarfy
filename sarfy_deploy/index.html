  box-shadow: 0 0 12px rgba(5, 150, 105, 0.2) !important;
}

[data-theme="light"] .street-amount-tray {
  background: #F8FAFC !important;
  border: 1px solid rgba(5, 150, 105, 0.25) !important;
}

[data-theme="light"] .quick-amount-pill {
  background: #FFFFFF !important;
  border: 1px solid #CBD5E1 !important;
  color: #0F172A !important;
}

[data-theme="light"] .quick-amount-pill:hover,
[data-theme="light"] .quick-amount-pill.active {
  background: #059669 !important;
  color: #FFFFFF !important;
  border-color: #059669 !important;
}

/* الأزرار وعناصر التحكم */
[data-theme="light"] .btn-secondary {
  background: #FFFFFF !important;
  border: 1px solid #CBD5E1 !important;
  color: #0F172A !important;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04) !important;
}

[data-theme="light"] .btn-secondary:hover {
  background: #F8FAFC !important;
  border-color: #94A3B8 !important;
}

[data-theme="light"] .btn-icon-subtle {
  background: #FFFFFF !important;
  border: 1px solid #CBD5E1 !important;
  color: #475569 !important;
}

[data-theme="light"] .btn-icon-subtle:hover {
  background: #F8FAFC !important;
  color: #0F172A !important;
  border-color: #94A3B8 !important;
}

[data-theme="light"] .privacy-toggle-btn {
  background: #FFFFFF !important;
  border: 1px solid #CBD5E1 !important;
  color: #475569 !important;
}

[data-theme="light"] .privacy-toggle-btn:hover {
  background: #F8FAFC !important;
  color: #0F172A !important;
  border-color: #94A3B8 !important;
}

/* حقول الإدخال والقوائم المنسدلة */
[data-theme="light"] .form-input,
[data-theme="light"] .form-select,
[data-theme="light"] .form-textarea {
  background-color: #FFFFFF !important;
  border: 1px solid #CBD5E1 !important;
  color: #0F172A !important;
}

[data-theme="light"] .form-input:focus,
[data-theme="light"] .form-select:focus,
[data-theme="light"] .form-textarea:focus {
  background-color: #FFFFFF !important;
  border-color: var(--emerald) !important;
  box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15) !important;
}

/* النوافذ المنبثقة والقوائم السفلية */
[data-theme="light"] .modal-overlay,
[data-theme="light"] .bottom-sheet-overlay {
  background-color: rgba(15, 23, 42, 0.35) !important;
}

[data-theme="light"] .modal-dialog,
[data-theme="light"] .bottom-sheet-dialog {
  background: #FFFFFF !important;
  border: 1px solid #E2E8F0 !important;
  box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.12) !important;
}

[data-theme="light"] .modal-header {
  border-bottom: 1px solid #F1F5F9 !important;
}

[data-theme="light"] .modal-footer {
  border-top: 1px solid #F1F5F9 !important;
}

/* شاشة القفل والرمز السري */
[data-theme="light"] .lockscreen-card {
  background: rgba(255, 255, 255, 0.96) !important;
  border: 1px solid #E2E8F0 !important;
  box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.08) !important;
}

[data-theme="light"] .pin-key-btn {
  background: #F8FAFC !important;
  border-color: #E2E8F0 !important;
  color: #0F172A !important;
}

[data-theme="light"] .pin-key-btn:hover {
  background: #F1F5F9 !important;
  border-color: #CBD5E1 !important;
}

/* شريط وقائمة الموبايل */
[data-theme="light"] .mobile-header,
[data-theme="light"] .mobile-bottom-nav {
  background: rgba(255, 255, 255, 0.94) !important;
  border-color: #E2E8F0 !important;
}

[data-theme="light"] .mobile-drawer {
  background: #FFFFFF !important;
  border-left-color: #E2E8F0 !important;
}

[data-theme="light"] .drawer-header {
  border-bottom-color: #F1F5F9 !important;
}

[data-theme="light"] .drawer-footer {
  border-top-color: #F1F5F9 !important;
}

[data-theme="light"] .drawer-link {
  color: #475569 !important;
}

[data-theme="light"] .drawer-link:hover {
  background: #F8FAFC !important;
  color: #0F172A !important;
}

[data-theme="light"] .drawer-link.active {
  background: #ECFDF5 !important;
  color: #059669 !important;
}

/* حاسبة مصاريف التحويل الرسمية */
.transfer-fee-calc-box {
  background: linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(30, 41, 59, 0.8) 100%);
  border: 1px solid var(--border-subtle);
}

[data-theme="light"] .transfer-fee-calc-box {
  background: linear-gradient(135deg, #FFFFFF 0%, #F8FAFC 100%) !important;
  border: 1px solid #E2E8F0 !important;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04) !important;
}

/* صندوق الضمان والأمان */
[data-theme="light"] .security-guarantee-box {
  background: rgba(5, 150, 105, 0.06) !important;
  border: 1px solid rgba(5, 150, 105, 0.2) !important;
}

/* بطاقة الأهداف المالية والادخار وقوس التقدم في الوضع النهاري */
[data-theme="light"] .goals-arc-card {
  background: #FFFFFF !important;
  border: 1px solid #E2E8F0 !important;
  color: #0F172A !important;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05) !important;
}

[data-theme="light"] .goals-arc-card::before {
  background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, transparent 70%) !important;
}

[data-theme="light"] .goal-pill {
  background: #F8FAFC !important;
  border: 1px solid #E2E8F0 !important;
  color: #334155 !important;
}

[data-theme="light"] .goal-pill:hover {
  background: #F1F5F9 !important;
  color: #0F172A !important;
  border-color: #CBD5E1 !important;
}

[data-theme="light"] .goal-pill.active {
  background: #ECFDF5 !important;
  color: #059669 !important;
  border-color: rgba(5, 150, 105, 0.3) !important;
  box-shadow: 0 0 10px rgba(5, 150, 105, 0.15) !important;
}

/* بانر التنبيهات الذكي في الوضع النهاري */
[data-theme="light"] .alerts-banner-card {
  background: #FFFFFF !important;
  border: 1px solid #E2E8F0 !important;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05) !important;
}
